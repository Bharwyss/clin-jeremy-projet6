<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter une connection — Pay My Buddy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <a class="logo" th:href="@{/transfer}">Pay My Buddy</a>
    <nav aria-label="Navigation principale">
        <a th:href="@{/transfer}">Transférer</a>
        <a th:href="@{/profile}">Profil</a>
        <a th:href="@{/connections}" aria-current="page">Ajouter relation</a>
        <form th:action="@{/logout}"  method="post">
            <button type="submit" class="link-button">Se déconnecter</button>
        </form>
    </nav>
</header>
<main>
    <h1>Ajouter une relation</h1>

    <p th:if="${success}" th:text="${success}" role="status" class="message success"></p>
    <p th:if="${error}" th:text="${error}" role="alert" class="message error"></p>

    <form th:action="@{/connections}" method="post" th:object="${connectionForm}">
        <div class="field">
            <label for="email">Chercher une relation</label>
            <input type="email" id="email" th:field="*{email}"
                   placeholder="Saisir une adresse mail">
            <span class="field-error" role="alert"
                  th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>
        <button type="submit">Ajouter</button>
    </form>

    <h2>Mes relations</h2>

    <ul th:if="${not #lists.isEmpty(connections)}">
        <li th:each="connection : ${connections}" th:text="${connection.username}"></li>
    </ul>
    <p th:if="${#lists.isEmpty(connections)}">Vous n'avez pas encore de relation.</p>
</main>
</body>
</html>
