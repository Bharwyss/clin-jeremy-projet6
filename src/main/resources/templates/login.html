<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Pay My Buddy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="auth-page">
    <h1>Pay My Buddy</h1>

    <p th:if="${success}" th:text="${success}" role="status" class="message success"></p>
    <p th:if="${param.error}" role="alert" class="message error">
        Adresse mail ou mot de passe incorrect.
    </p>
    <p th:if="${param.logout}" role="status" class="message success">
        Vous avez été déconnecté.
    </p>

    <form th:action="@{/login}" method="post">

        <div class="field">
            <label for="username">Adresse mail</label>
            <input type="email" id="username" name="username"
                   required autocomplete="username">
        </div>

        <div class="field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   required autocomplete="current-password">
        </div>

        <button type="submit">Se connecter</button>
    </form>

    <p>Pas encore de compte ? <a th:href="@{/register}">S'inscrire</a></p>
</main>

</body>
</html>
