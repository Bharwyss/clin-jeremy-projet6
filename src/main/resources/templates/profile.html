<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil — Pay My Buddy</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <a class="logo" th:href="@{/transfer}">Pay My Buddy</a>
    <nav aria-label="Navigation principale">
        <a th:href="@{/transfer}">Transférer</a>
        <a th:href="@{/profile}" aria-current="page">Profil</a>
        <a th:href="@{/connections}">Ajouter relation</a>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="link-button">Se déconnecter</button>
        </form>
    </nav>
</header>

<main>
    <h1>Mon profil</h1>

    <p th:if="${success}" th:text="${success}" role="status" class="message success"></p>
    <p th:if="${error}" th:text="${error}" role="alert" class="message error"></p>

    <form th:action="@{/profile}" method="post" th:object="${profileForm}">

        <div class="field">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" th:field="*{username}"
                   maxlength="30" autocomplete="username">
            <span class="field-error" role="alert"
                  th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="field">
            <label for="email">Adresse mail</label>
            <input type="email" id="email" th:field="*{email}"
                   maxlength="255" autocomplete="email" aria-describedby="email-help">
            <span id="email-help" class="help">Modifier votre adresse mail vous déconnectera.</span>
            <span class="field-error" role="alert"
                  th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <div class="field">
            <label for="password">Nouveau mot de passe</label>
            <input type="password" id="password" th:field="*{password}"
                   autocomplete="new-password" aria-describedby="password-help">
            <span id="password-help" class="help">Laisser vide pour conserver le mot de passe actuel.</span>
            <span class="field-error" role="alert"
                  th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <button type="submit">Modifier</button>
    </form>
</main>

</body>
</html>
